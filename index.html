<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Color Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-800 text-gray-200 flex items-center justify-center min-h-screen">
    <div class="w-full h-[400px] bg-gray-900 rounded-xl shadow-2xl p-2 color-editor-layout">

        <div id="hs-pane-wrapper" class="flex flex-col h-full min-w-0">
            <div class="panel-header">
                <button id="tab-rgb-cube" class="tab-button">RGB Cube</button>
                <button id="tab-hsl-cone" class="tab-button">HSL Di-Cone</button>
            </div>
            <div id="hs-canvas-container" class="canvas-container">
                <canvas id="hs-bg-canvas"></canvas>
                <div id="hs-nodes-container" class="absolute top-0 left-0 w-full h-full"></div>
            </div>
        </div>

        <div id="lightness-wrapper" class="flex flex-col min-h-0">
            <h2 class="panel-header">Lightness</h2>
            <div id="lightness-slider-container" class="canvas-container">
                <canvas id="lightness-bg-canvas"></canvas>
                <div id="lightness-nodes-container" class="absolute top-0 left-0 w-full h-full"></div>
            </div>
        </div>

        <div id="alpha-wrapper" class="flex flex-col min-h-0">
            <h2 class="panel-header">Alpha</h2>
            <div id="alpha-slider-container" class="canvas-container">
                <canvas id="alpha-bg-canvas"></canvas>
                <div id="alpha-nodes-container" class="absolute top-0 left-0 w-full h-full"></div>
            </div>
        </div>

        <div id="colors-presets-wrapper" class="preset-wrapper">
            </div>

        <div id="colormaps-presets-wrapper" class="preset-wrapper">
            </div>

        <div id="selected-color-section" class="control-section">
             <div class="section-header">
                <div class="preview-container swatch-preview">
                    <canvas id="selected-color-preview-canvas"></canvas>
                </div>
                <h3 class="section-title">Selected Color</h3>
             </div>
             <div class="space-y-2 mt-2">
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <h3 class="input-label">Lightness</h3>
                        <input type="text" id="lightness-input" class="value-input">
                    </div>
                    <div>
                        <h3 class="input-label">Alpha</h3>
                        <input type="text" id="alpha-input" class="value-input">
                    </div>
                </div>
                <div id="color-readout-container">
                    <div id="rgb-inputs-container">
                        <h3 class="input-label text-center mb-1">RGB (0-255)</h3>
                        <div class="grid grid-cols-3 gap-1">
                            <input type="text" id="rgb-r-input" placeholder="R" class="value-input">
                            <input type="text" id="rgb-g-input" placeholder="G" class="value-input">
                            <input type="text" id="rgb-b-input" placeholder="B" class="value-input">
                        </div>
                    </div>
                    <div id="hsl-inputs-container" class="hidden">
                        <h3 class="input-label text-center mb-1">HSL (0-1)</h3>
                        <div class="grid grid-cols-3 gap-1">
                            <input type="text" id="hsl-h-input" placeholder="H" class="value-input">
                            <input type="text" id="hsl-s-input" placeholder="S" class="value-input">
                            <input type="text" id="hsl-l-input" placeholder="L" class="value-input">
                        </div>
                    </div>
                </div>
             </div>
        </div>
        
        <div id="current-colormap-section" class="control-section">
            <h3 class="section-title">Current Colormap</h3>
            <div class="preview-container">
                <canvas id="colormap-preview-canvas"></canvas>
            </div>
            <button id="select-button" class="select-button mt-auto">Select</button>
        </div>

    </div> <div id="modal-overlay" class="modal-overlay hidden">
        <div id="modal-dialog" class="modal-dialog">
            <h3 id="modal-title" class="modal-title"></h3>
            <div id="modal-input-container" class="hidden">
                <input type="text" id="modal-input" class="modal-input">
            </div>
            <div id="modal-buttons" class="modal-buttons">
                </div>
        </div>
    </div>

    <div id="context-menu" class="context-menu hidden">
        </div>

    <script type="module" src="script.js"></script>
</body>
</html>
