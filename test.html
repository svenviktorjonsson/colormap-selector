<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colormap Selector Test Page</title>
    
    <!-- Link to your component's stylesheet -->
    <link rel="stylesheet" href="styles.css">
    
    <style>
        /* Basic styles for the test page */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #2d3748;
            color: #e2e8f0;
            padding: 2rem;
            text-align: center;
        }
        #display-canvas {
            border: 2px solid #4a5568;
            border-radius: 0.375rem;
            margin-top: 1rem;
            width: 100%;
            max-width: 600px;
            height: 60px;
            background-image:
                linear-gradient(45deg, #4a5568 25%, transparent 25%),
                linear-gradient(-45deg, #4a5568 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #4a5568 75%),
                linear-gradient(-45deg, transparent 75%, #4a5568 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
        #open-editor-button {
            font-size: 1rem;
            font-weight: 500;
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            border-radius: 0.5rem;
            border: none;
            background-color: #3b82f6;
            color: white;
            transition: background-color 0.2s;
        }
        #open-editor-button:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>
    <h1>Colormap Selector Test</h1>
    <p>Click the button to open the colormap editor. When you click "Select", the chosen colormap will be displayed on the canvas below.</p>
    <button id="open-editor-button">Open Colormap Editor</button>
    <canvas id="display-canvas"></canvas>

    <!-- The application logic will be in this file -->
    <script type="module" src="test-app.js"></script>
</body>
</html>
