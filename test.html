<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colormap Selector Test Page</title>
    
    <!-- Link to your component's stylesheet -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="node_modules/katex/dist/katex.min.css">
    <script src="node_modules/katex/dist/katex.min.js"></script>
    
    <style>
        /* Basic styles for the test page */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #2d3748;
            color: #e2e8f0;
            margin: 0;
            padding: 1rem;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header-section {
            text-align: center;
            margin-bottom: 1rem;
        }
        
        .canvas-section {
            position: fixed;
            top: 1rem;
            right: 1rem;
            width: 400px;
            z-index: 999;
        }
        
        .canvas-label {
            font-size: 0.8rem;
            color: #a0aec0;
            margin-bottom: 0.5rem;
            text-align: center;
        }
        
        #display-canvas {
            border: 2px solid #4a5568;
            border-radius: 0.375rem;
            width: 100%;
            height: 40px;
            cursor: pointer; /* Add this line */
            background-image:
                linear-gradient(45deg, #4a5568 25%, transparent 25%),
                linear-gradient(-45deg, #4a5568 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #4a5568 75%),
                linear-gradient(-45deg, transparent 75%, #4a5568 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
        }
        
        #open-editor-button {
            font-size: 1rem;
            font-weight: 500;
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            border-radius: 0.5rem;
            border: none;
            background-color: #3b82f6;
            color: white;
            transition: background-color 0.2s;
        }
        
        #open-editor-button:hover {
            background-color: #2563eb;
        }
        
        .instructions {
            margin: 1rem 0;
            font-size: 0.9rem;
            color: #a0aec0;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="canvas-section">
        <div class="canvas-label">Current Colormap</div>
        <canvas id="display-canvas"></canvas>
    </div>
    
    <div class="content">
        <div class="header-section">
            <h1>Colormap Selector Test</h1>
            <div class="instructions">
                <p>Click the button to open the colormap editor.</p>
                <p>Click <strong>"Select"</strong> to apply your colormap to the canvas above (editor stays open).</p>
                <p>Click <strong>"Close"</strong> when you're done editing.</p>
            </div>
            <button id="open-editor-button">Open Colormap Editor</button>
        </div>
    </div>

    <!-- The application logic will be in this file -->
    <script type="module" src="test-app.js"></script>
</body>
</html>
