<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colormap Selector Test Page</title>
    
    <!-- Link to your component's stylesheet -->
    <link rel="stylesheet" href="../dist/style.css?v=1.2.0">
    <link rel="stylesheet" href="../node_modules/katex/dist/katex.min.css">
    <script src="../node_modules/katex/dist/katex.min.js"></script>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="canvas-section">
        <div class="canvas-label">Current Colormap</div>
        <canvas id="display-canvas"></canvas>
    </div>
    
    <div class="content">
        <div class="header-section">
            <h1>Colormap Selector Test</h1>
            <div class="instructions">
                <p>1. <strong>Open Editor</strong> to create/edit colormaps.</p>
                <p>2. <strong>Select</strong> to apply the map to the canvas.</p>
                <p>3. <strong>Export JSON</strong> to save your custom presets to a file.</p>
            </div>
            <div class="button-row" style="display: flex; gap: 10px; justify-content: center;">
                <button id="open-editor-button">Open Colormap Editor</button>
                <button id="export-button" style="background-color: #4a5568;">Export Presets JSON</button>
            </div>
        </div>
    </div>

    <!-- The application logic will be in this file -->
    <script type="module" src="./test.js"></script>
</body>
</html>
